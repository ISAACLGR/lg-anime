[build]
  command = "pnpm install && pnpm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  EXPO_PUBLIC_API_URL = "https://lg-anime.onrender.com"

[[redirects]]
  from = "/_sitemap"
  to = "/_sitemap"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
